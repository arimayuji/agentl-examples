name: spending

# USAspending loads new data once a day, overnight US time. 06:07 UTC is after the load; GitHub
# may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spending
  cancel-in-progress: false

jobs:
  refresh:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spending
    env:
      # Optional repository variables. The monthly cap is spread over the daily runs by run.py.
      SPENDING_MODEL: ${{ vars.SPENDING_MODEL || 'openai/gpt-4.1-nano' }}
      SPENDING_BUDGET_USD: ${{ vars.SPENDING_BUDGET_USD || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Pinned to a commit of agentl main: the llm rate_limit and the eval cost per right answer
      # used here are not in the 0.12.0 release on PyPI yet.
      - name: Install agentl
        id: deps
        run: pip install "agentl-etl @ git+https://github.com/arimayuji/agentl@df37a40c349a74833de545007fe96ee8ca90a8ce"

      # The run store (if_changed validators, the per-award LLM cache), the history database and
      # the last exported data, including status.json with this month's LLM spend.
      # The cache holds data, not code, and only schedule and dispatch runs on the default branch
      # write it (no pull_request trigger), so no untrusted ref can seed it.
      - name: Restore agentl state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            spending/.agentl
            spending/data
            spending/site/data
          key: spending-state-${{ github.run_id }}
          restore-keys: spending-state-

      # Scores the classify step on the hand-labelled golden set. Skipped without the key; a
      # failed eval does not block the data.
      - name: Evaluate the classifier
        id: eval
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is not set: skipping the eval."
            exit 0
          fi
          agentl eval pipeline.yaml --json > eval.json
          # One line per report and the first differences, so a bad run is readable in the log.
          python -c "import json; [print(r['step'], r['right'], '/', r['records'], 'right, cost', r['cost_usd'], r['diffs'][:3]) for r in json.load(open('eval.json'))]"

      # Without the key, run.py publishes the awards unclassified instead of failing.
      - name: Run the pipeline
        id: run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python run.py

      - name: Publish pipeline.yaml with the site
        if: ${{ !cancelled() }}
        run: cp pipeline.yaml site/pipeline.yaml

      # Deploys after a failed run too, so the status panel shows the failure.
      - name: Deploy to Cloudflare Pages
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Creates the Pages project on the first deploy; later runs see it exists and go on.
          preCommands: npx --yes wrangler pages project create agentl-spending --production-branch=main || true
          command: pages deploy spending/site --project-name=agentl-spending --branch=main
