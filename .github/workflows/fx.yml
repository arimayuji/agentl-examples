name: fx

# The ECB publishes the reference rates around 16:00 CET on working days.
# 15:30 UTC is 16:30 CET in winter and 17:30 CEST in summer.
on:
  schedule:
    - cron: "30 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fx
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install agentl
        id: deps
        run: pip install "agentl-etl==0.12.0"

      # The run store (if_changed validators, check baselines), the history database and the
      # last exported data. Each run saves a new entry; the newest one is restored.
      # The cache holds data, not code, and only schedule and dispatch runs on the default branch
      # write it (no pull_request trigger), so no untrusted ref can seed it.
      - name: Restore agentl state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            fx/.agentl
            fx/data
            fx/site/data
          key: fx-state-${{ github.run_id }}
          restore-keys: fx-state-

      - name: Run the pipeline
        id: run
        run: python run.py

      # Deploys after a failed run too, so the status panel shows the failure.
      - name: Deploy to Cloudflare Pages
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Creates the Pages project on the first deploy; later runs see it exists and go on.
          preCommands: wrangler pages project create agentl-fx --production-branch=main || true
          command: pages deploy fx/site --project-name=agentl-fx --branch=main
